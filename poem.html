<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение стихотворения</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← На главную</a>
        
        <header style="margin-top: 10px;">
            <h1 id="poemTitle">Загрузка...</h1>
            <button class="theme-toggle" id="themeToggle">🌙 Ночь</button>
        </header>

        <main>
            <div class="poem-text" id="poemBody">Пожалуйста, подождите...</div>
            
            <div class="poem-explanation" id="poemExplanation" style="display: none;">
                <strong>О стихотворении:</strong> <span id="poemExplanationText"></span>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        try {
            if (typeof poetryData === 'undefined') {
                throw new Error("Файл data.js не найден или не загрузился!");
            }

            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            const poemId = params.get('poemId');
            const colId = params.get('colId');

            let targetPoem = null;
            let parentCollection = null;

            if (type === 'single') {
                targetPoem = poetryData.singlePoems.find(p => p.id === poemId);
            } else if (type === 'collection') {
                parentCollection = poetryData.collections.find(c => c.id === colId);
                if (parentCollection) {
                    targetPoem = parentCollection.poems.find(p => p.id === poemId);
                }
            }

            // Функция установки фона стихотворения
            function updatePoemBackground(theme) {
                if (parentCollection && parentCollection.image) {
                    if (theme === 'dark') {
                        document.body.style.backgroundImage = `linear-gradient(rgba(13, 9, 20, 0.85), rgba(13, 9, 20, 0.92)), url('${parentCollection.image}')`;
                    } else {
                        document.body.style.backgroundImage = `linear-gradient(rgba(20, 15, 30, 0.90), rgba(20, 15, 30, 0.95)), url('${parentCollection.image}')`;
                        document.documentElement.style.setProperty('--text-color', '#e4e1ed');
                        document.documentElement.style.setProperty('--muted-color', '#9c95b0');
                        document.documentElement.style.setProperty('--card-bg', 'rgba(26, 20, 38, 0.75)');
                        document.documentElement.style.setProperty('--border-color', '#2e2440');
                    }
                    // Картинка видна целиком без обрезки
                    document.body.style.backgroundSize = 'contain';
                    document.body.style.backgroundRepeat = 'no-repeat';
                    document.body.style.backgroundPosition = 'center top';
                    document.body.style.backgroundAttachment = 'fixed';
                }
            }

            const toggleBtn = document.getElementById('themeToggle');
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            toggleBtn.textContent = currentTheme === 'dark' ? '☀️ День' : '🌙 Ночь';
            
            updatePoemBackground(currentTheme);

            toggleBtn.addEventListener('click', () => {
                let theme = document.documentElement.getAttribute('data-theme');
                let newTheme = theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                toggleBtn.textContent = newTheme === 'dark' ? '☀️ День' : '🌙 Ночь';
                updatePoemBackground(newTheme);
                location.reload();
            });

            if (targetPoem) {
                document.title = targetPoem.title;
                document.getElementById('poemTitle').textContent = targetPoem.title;
                document.getElementById('poemBody').textContent = targetPoem.text;
                
                const explanationBlock = document.getElementById('poemExplanation');
                const explanationText = document.getElementById('poemExplanationText');
                
                if (targetPoem.explanation) {
                    explanationText.textContent = targetPoem.explanation;
                    explanationBlock.style.display = 'block';
                } else {
                    explanationBlock.style.display = 'none';
                }
            } else {
                document.getElementById('poemTitle').textContent = 'Стихотворение не найдено';
                document.getElementById('poemBody').innerHTML = `
                    Не удалось найти стихотворение в базе данных.<br>
                    <small style="color: var(--muted-color);">Параметры ссылки — тип: ${type}, id стиха: ${poemId}, id сборника: ${colId}</small>
                `;
            }

        } catch (error) {
            document.getElementById('poemTitle').textContent = 'Ошибка загрузки';
            document.getElementById('poemBody').innerHTML = `<span style="color: #ff6b6b;">Произошла ошибка скрипта: ${error.message}</span>`;
            console.error(error);
        }
    </script>
</body>
</html>
