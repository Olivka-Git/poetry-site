<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сборник</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← На главную</a>
        
        <header>
            <div class="author-block">
                <h1 id="colTitle" class="author-name" style="font-size: 1.8rem;">Загрузка...</h1>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙 Ночь</button>
        </header>
		
		<div id="colCoverWrapper" style="display: none; margin-bottom: 25px;">
			<img id="colCoverImg" src="" alt="Обложка сборника" style="width: 100%; height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
		</div>
		
        <main>
            <p id="colDesc" style="color: var(--muted-color); font-style: italic; margin-bottom: 30px;"></p>
            <h2>Список стихотворений</h2>
            <ul class="poem-list" id="colPoemsList">
            </ul>
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        // Темы
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.textContent = currentTheme === 'dark' ? '☀️ День' : '🌙 Ночь';

        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.textContent = newTheme === 'dark' ? '☀️ День' : '🌙 Ночь';
        });

        // Читаем ID сборника из URL
        const params = new URLSearchParams(window.location.search);
        const colId = params.get('colId');

        const collection = poetryData.collections.find(c => c.id === colId);

if (collection) {
    document.title = collection.title;
    document.getElementById('colTitle').textContent = collection.title;
    document.getElementById('colDesc').textContent = collection.description;

    // Выводим картинку-обложку, если она указана в data.js
    if (collection.image) {
        const coverWrapper = document.getElementById('colCoverWrapper');
        const coverImg = document.getElementById('colCoverImg');
        coverImg.src = collection.image;
        coverWrapper.style.display = 'block';
    }

    const listEl = document.getElementById('colPoemsList');
    collection.poems.forEach(poem => {
        listEl.innerHTML += `
            <li>
                <a href="poem.html?type=collection&colId=${collection.id}&poemId=${poem.id}" style="font-size: 1.1rem;">
                    ${poem.title}
                </a>
            </li>
        `;
    });
}
		
		else {
            document.getElementById('colTitle').textContent = 'Сборник не найден';
        }
    </script>
</body>
</html>
