<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поэзия</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем красивый шрифт с засечками для стихов -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="author-block">
                <img src="images\avatar.jpg" alt="Аватар автора" class="author-avatar">
                <div class="author-info">
                    <!-- Здесь можно написать имя или псевдоним друга -->
                    <h1 class="author-name">TessMonde</h1>
                    <p class="author-bio">Сборник стихотворений и личных заметок</p>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙 Ночь</button>
        </header>

        <main id="content">
            <!-- Сюда JavaScript автоматически выведет содержимое -->
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        // Скрипт темы (оставляем как был)
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.textContent = currentTheme === 'dark' ? '☀️ День' : '🌙 Ночь';

        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.textContent = newTheme === 'dark' ? '☀️ День' : '🌙 Ночь';
        });

        // Отрисовка главной страницы
        const contentDiv = document.getElementById('content');

        let htmlContent = '<h2 style="margin-bottom: 20px;">Сборники стихов</h2><div class="collections-grid">';
        
        // Выводим сборники карточками
        poetryData.collections.forEach(col => {
            htmlContent += `
                <a href="collection.html?colId=${col.id}" class="collection-card" style="background-image: linear-gradient(to top, rgba(15,12,27,0.9), rgba(15,12,27,0.3)), url('${col.image}');">
                    <div class="card-content">
                        <h3>${col.title}</h3>
                        <p>${col.description}</p>
                    </div>
                </a>
            `;
        });
        htmlContent += '</div>';

        // Отдельные стихи
        htmlContent += '<h2 style="margin-top: 40px; margin-bottom: 20px;">Отдельные стихотворения</h2><ul class="poem-list">';
        poetryData.singlePoems.forEach(poem => {
            htmlContent += `
                <li>
                    <a href="poem.html?type=single&poemId=${poem.id}">${poem.title}</a> 
                    <span style="font-size: 0.85rem; color: var(--muted-color); float: right;">${poem.date}</span>
                </li>
            `;
        });
        htmlContent += '</ul>';

        contentDiv.innerHTML = htmlContent;
    </script>
</body>
</html>
